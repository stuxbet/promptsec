name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: syntax + import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources
        run: python -m compileall src tests

      - name: Smoke import
        run: |
          python -c "import src.cli.main; import src.assistant.baseline; import src.assistant.defended; import src.evaluation.runner; import src.llm.interface"

      - name: Seed synthetic data
        run: python -m src.cli.main seed-data
