[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defending-internal-ai-assistant"
version = "0.1.0"
description = "Offline-first lab repo for evaluating defenses against indirect prompt injection in an internal AI assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Student Team Placeholder" }
]
dependencies = [
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "pydantic>=2.7,<3",
  "pytest>=8.0,<9",
  "typer>=0.12,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
